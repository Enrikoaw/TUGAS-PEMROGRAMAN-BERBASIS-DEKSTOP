<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemesanan Bahan Ajar SITTA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        
        <header class="head-STTA">
            <h1>Aplikasi Pemesanan Bahan Ajar SITTA</h1>
        </header>
        
        <main>
            
            <section class="form-container">
                <h2>Form Pemesanan Bahan Ajar</h2>
                
                <form id="order-form" class="input-group" action="">
                    
                    <div class="form-group">
                        <label for="nama-mahasiswa">Nama Mahasiswa</label>
                        <input type="text" id="nama-mahasiswa" name="nama" placeholder="Masukkan nama lengkap">
                        <p class="error-text" id="nama-error"></p>
                    </div>

                    <div class="form-group">
                        <label for="nama-mahasiswa">Nim Mahasiswa</label>
                        <input type="text" id="nama-mahasiswa" name="nama" placeholder="Masukkan Nim">
                        <p class="error-text" id="nama-error"></p>
                    </div>
                    
                    <div class="form-group">
                        <label for="kode-buku">Kode Bahan Ajar</label>
                        <input type="text" id="kode-buku" name="kode" placeholder="Contoh: MKDU4107">
                        <p class="error-text" id="kode-error"></p>
                    </div>
                    
                    <div class="form-group">
                        <label for="jumlah">Jumlah</label>
                        <input type="number" id="jumlah" name="jumlah" min="1" placeholder="0">
                        <p class="error-text" id="jumlah-error"></p>
                    </div>
                    
                    <div class="form-group">
                        <button type="submit" class="btn-submit">Pesan Sekarang</button>
                    </div>
                    
                </form>
            </section>
            
            <section class="list-container">
                <h2>Daftar Pesanan Bahan Ajar</h2>
                
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama Mahasiswa</th>
                            <th>Kode Bahan Ajar</th>
                            <th>Jumlah</th>
                            <th>Aksi</th> </tr>
                    </thead>
                    <tbody id="order-list">
                        </tbody>
                    <tfoot>
                        <tr>
                            <td colspan="4">Total Item Pesanan</td>
                            <td id="total-items">0</td>
                        </tr>
                    </tfoot>
                </table>
            </section>
            
        </main>
    </div>

    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modal-title">Pesanan Berhasil!</h3>
            <p id="modal-message">Data pesanan Anda telah berhasil ditambahkan.</p>
            <button id="modal-close-btn" class="btn-submit">Tutup</button>
        </div>
    </div>

    <script src="komponen.js"></script>
</body>
</html>
